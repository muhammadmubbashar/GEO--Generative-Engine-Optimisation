[project]
name = "geo-bench-fc"
version = "0.1.0"
description = "Controlled benchmark for Generative Engine Optimisation — Flight Centre study (QUT Team 62)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "numpy>=1.26",
  "scipy>=1.11",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]

[project.scripts]
geo = "geo_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geo_bench*"]
